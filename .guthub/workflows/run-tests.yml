name: Run Unit Tests and Generate Allure Report

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        language: [python, csharp]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get the committer's name
        id: get-committer
        run: echo "COMMITTER_NAME=$(git log -1 --pretty=format:'%an')" >> $GITHUB_ENV

      # --- Python Steps ---
      - name: Set up Python (if applicable)
        if: matrix.language == 'python'
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies for Python
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install pytest allure-pytest

      - name: Set up SQLite functions and database
        if: matrix.language == 'python'
        run: python3 setup_database.py

      - name: Run Python unit tests and generate Allure results
        if: matrix.language == 'python'
        run: pytest --alluredir=./allure-results

      # --- C# Steps ---
      - name: Set up .NET (if applicable)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.x'

      - name: Restore C# dependencies
        if: matrix.language == 'csharp'
        run: dotnet restore

      - name: Run C# unit tests
        if: matrix.language == 'csharp'
        run: dotnet test

      # --- Generate Allure Report and Deploy ---
      - name: Install Allure CLI
        if: matrix.language == 'python'
        run: |
          curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/latest/download/allure-2.20.1.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.20.1 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure report
        if: matrix.language == 'python'
        run: allure generate ./allure-results --clean -o ./allure-report

      - name: Customize Allure report title
        if: matrix.language == 'python'
        run: |
          echo "<html><head><title>Allure Report - $COMMITTER_NAME</title></head>" > ./allure-report/index.html
          cat ./allure-report/index.html | tail -n +2 >> ./allure-report/index.html

      - name: Deploy Allure report to GitHub Pages
        if: matrix.language == 'python'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report